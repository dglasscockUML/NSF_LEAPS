status:
  scope: >-
    Every result in the source paper labelled lemma, proposition, corollary or theorem is
    fully formalized in the development. The development additionally formalizes a
    companion paper, "The local dynamical structure of Delta* sets via a new Furstenberg
    family algebra", whose main results are registered as Palomar entry PALOMAR-2026-10-18-000015; the two
    formalizations share a single repository and a substantial body of common material.

    The Challenge file registers the six theorems of the introduction, stated as five
    declarations: Theorems A, B, C and D individually, and Theorems E and F together as
    RPTheoremsEandF. The remaining formalized results, including everything in Sections 2
    through 7 beyond those six statements, are present in the development but are not part
    of the registered statement set.

    Hypotheses are carried explicitly rather than by convention. Semigroups are assumed
    nonempty and acting spaces are assumed nonempty, compact and Hausdorff; these appear as
    typeclass hypotheses on every definition and theorem. The paper assumes compact
    Hausdorff phase spaces throughout and treats nonemptiness as implicit. Commutativity of
    the acting semigroup is assumed exactly where the paper assumes it, in all six
    theorems. No countability, cancellativity, surjectivity or invertibility hypothesis is
    imposed anywhere; in particular Theorem E is proved without the cancellativity
    assumption used in prior work on natural extensions for semigroup actions.

    The definitions registered in the Challenge are stated for arbitrary systems satisfying
    those hypotheses and admit no degenerate instances that the paper excludes. There is no
    partial operation in the statements whose Mathlib totality could make a conclusion
    vacuous: RP and RP^- are intersections of closures of preimages or images over
    neighbourhoods of the diagonal; the equicontinuous structure relation is an
    intersection over a family of closed invariant equivalence relations that always
    contains the full relation, so it is never an empty intersection; and quotients by an
    ICER are formed from a genuine Setoid, with the compact Hausdorff structure on the
    quotient established in the Challenge rather than assumed.

    No result is assumed from the literature rather than derived. Every result the proofs
    depend on is either proved within the development or available in the pinned Mathlib.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Hand-coding of most of the development, including every definition and theorem
        statement outside the four files named in the entries below, and hand-scaffolding
        of helper theorem statements and proof steps.
      cost:
        wall_time: "approximately 6 months of effort"
        spend_usd: "n/a"
        hardware: "n/a"
      prompting_notes: "n/a"

    - method: "agent"
      models: ["Claude Opus 5 High"]
      framework: "Claude Code"
      tool_setup: >-
        Autonomous coding of the file FF_Pontryagin.lean, completed in a single pass with a
        sorry-free build. The target theorem, PontryaginDual.exists_apply_ne_one, that
        characters separate points in a compact abelian group, is classical but not
        available in Mathlib.
      cost:
        wall_time: "approximately 1 hour"
        spend_usd: "subscription-based"
        hardware: "local machine and API"
      prompting_notes: >-
        Instructions were to match the hand-stated target theorem
        PontryaginDual.exists_apply_ne_one; to make edits only to the file
        FF_Pontryagin.lean; and to find and use whichever proof of the target theorem is
        best suited to formalization in Lean 4.

    - method: "copilot"
      models: ["Claude Opus 5 High"]
      framework: "Claude Code"
      tool_setup: >-
        The authors hand-scaffolded the main theorems in RP_Nat_ext.lean, and the model
        supplied some definitions and most of the proofs in that file. In the course of
        this work the model also produced the file TP_Cylinders.lean in its entirety: a
        collection of lemmas on the uniform topology of product spaces needed for the
        natural extension results. The definitions, theorem statements and proofs in
        TP_Cylinders.lean are the model's rather than the authors'.
      cost:
        wall_time: "approximately 1 hour over a single run"
        spend_usd: "subscription-based"
        hardware: "local machine and API"
      prompting_notes: >-
        Instructions were to provide proofs for the already-scaffolded main theorems in
        RP_Nat_ext.lean, following proofs supplied by the authors in a write-up, and not to
        edit the main theorem statements in any way. Supporting lemmas on the uniform
        topology of product spaces were collected by the model into the new file
        TP_Cylinders.lean in the course of that work.

    - method: "copilot"
      models: ["Claude Opus 5 High"]
      framework: "Claude Code"
      tool_setup: >-
        The model supplied proofs of approximately two dozen theorems across the project,
        following proofs the authors wrote in English in LaTeX and provided to it. Work
        proceeded on a theorem-by-theorem basis, with output reviewed and managed after
        each call. Helper lemmas introduced by the model were organized by hand into the
        project structure; several were manually organized into TP_Defs.lean. The proof of
        the instance `T2Space (ICERQuotient I)` in the Challenge file was supplied in this
        way: the statement and the mathematical argument are the authors', given to the
        model in English, and the model rendered that argument in Lean.
      cost:
        wall_time: "approximately 2 hours, broken into runs of roughly 10 minutes"
        spend_usd: "subscription-based"
        hardware: "local machine and API"
      prompting_notes: >-
        Instructions were given on a line-by-line basis. A representative prompt: "Write a
        proof of preStrongIPIffStrongCentralInCountCommSemi in the FF_Defs.lean file. Add
        lines only; do not modify or delete any lines. Follow the proof in the attached pdf
        file. Do not change any other part of the FF_Defs.lean file. If you need a helper
        lemma, you can write it just above preStrongIPIffStrongCentralInCountCommSemi.
        Before writing a helper lemma, search for what you need in the files upstream in
        the project."

    - method: "copilot"
      models: ["ChatGPT 5.6 Sol", "ChatGPT 5.6 Luna"]
      framework: "ChatGPT web interface"
      tool_setup: >-
        Used throughout the project to suggest tactics at particular points in proofs, to
        diagnose compilation errors, and to search Mathlib. No file was authored in this
        role; suggestions were incorporated by hand.
      cost:
        wall_time: "approximately 1 hour over dozens of calls"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Individual lines or blocks of code were copy-pasted when calling the model for help
        with a specific problem during proof writing or code debugging. Responses were
        copied back into the code line by line and verified by the authors.

    - method: "copilot"
      models: ["ChatGPT 5.6 Sol"]
      framework: "ChatGPT web interface"
      tool_setup: >-
        Creation of the file FF_CXX.lean, which allows the space of continuous self-maps of
        a compact Hausdorff space X to be treated as a monoid under composition. The
        definitions, theorem statements and proofs in this file are the model's rather than
        the authors'.
      cost:
        wall_time: "approximately 10 minutes across four calls"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        The file was created by prompting the model four times, copying the suggested code
        into the file, and verifying that it functioned as intended.
  spend_usd: "subscription-based"
  notes: >-
    The mathematics of the source paper is the authors' own. Every definition, theorem
    statement and proof appearing in the paper was developed and written by the authors as
    mathematical prose, independently of and prior to formalization; no generative AI was
    used to obtain the mathematical results. The account below concerns the separate
    question of how that mathematics, and the supporting machinery around it, was rendered
    in Lean.

    Coding agents contributed in five distinguishable ways. Claude Opus 5 wrote the
    definitions, theorems and proofs in FF_Pontryagin.lean. Claude Opus 5 wrote some
    definitions and most of the proofs in RP_Nat_ext.lean, working from theorem statements
    the authors had scaffolded by hand, and in the course of that work produced
    TP_Cylinders.lean in its entirety. Claude Opus 5 supplied Lean proofs for approximately
    two dozen theorems scattered through the project, one at a time, from English proofs the
    authors wrote and provided. ChatGPT 5.6 Sol wrote the definitions, theorems and proofs
    in FF_CXX.lean. ChatGPT 5.6 Sol and Luna were used throughout for tactic suggestions,
    compilation diagnostics and Mathlib search.

    Outside those four files and those roles, all code was written by hand, with one
    exception in the Challenge file noted below. Every definition and theorem statement
    registered in this submission was written by hand.

    The Challenge file contains one piece of machine-written code: the Lean proof of the
    instance T2Space (ICERQuotient I), rendered by Claude Opus 5 High from an English proof
    the authors wrote and supplied, as part of the theorem-by-theorem work described above.
    The statement of that instance and the argument it encodes are the authors'. Because
    the Challenge file is the surface a reader audits, this is recorded explicitly:
    everything else in that file, including every definition and every registered theorem
    statement, was written by hand.

    Three of these contributions went beyond encoding mathematics the authors had already
    written. In FF_Pontryagin.lean the target statement was fixed by hand but the model
    chose the proof; the result concerned, that the characters of a compact abelian group
    separate its points, is classical, is not original to this paper, and does not appear in
    the present paper; FF_Pontryagin.lean supports results in the companion paper rather
    than this one. In FF_CXX.lean and TP_Cylinders.lean the models produced the statements
    as well as the proofs, in the first case from a description of what was wanted and in
    the second as supporting lemmas the model identified as necessary while proving results
    the authors had scaffolded.

    The definitions and statements registered in this submission are hand-written, but the
    proofs that discharge them are not independent of machine-written code: RP_Nat_ext.lean,
    TP_Cylinders.lean and FF_CXX.lean all supply machinery that the registered proofs depend
    on, and the natural extension results of Theorems E and F rest directly on the first two.
    A reader auditing the Challenge statements reads only hand-written code; a reader
    auditing the proof development will encounter machine-written code.

    All submitted code was reviewed by the authors and checked by the Lean elaborator and
    compiler. The authors are responsible for the mathematical content of the
    formalization, the correctness of the statements, and the interpretation of the
    resulting code. We do not claim independent peer review or a complete line-by-line
    human audit of every machine-generated proof.
fidelity:
  divergences: >-
    For Theorems A, B, C and D there are no known divergences between the formally verified
    statements in Lean and the statements of the main theorems in the introduction of the
    source paper.

    Theorems E and F are stated as two theorems in the paper and as a single declaration,
    RPTheoremsEandF, in the Challenge file and in the development. Theorem E asserts the
    existence of a natural extension with a universal property, and Theorem F describes
    further properties of that same extension. Formalizing them separately would require
    either re-deriving the extension in Theorem F or exporting it as a definition; stating
    the conclusions of Theorem F immediately after the existential assertion of Theorem E
    was the more direct formalization. The content of both theorems is present in full.

    Two further points about that declaration are worth recording, as both make the Lean
    statement stronger than the paper's rather than weaker. First, the paper's Theorem E
    asserts the existence of a minimal S-system W on which S acts by homeomorphisms; the
    Lean statement produces W as a minimal system under the Grothendieck group Gr(S) and
    obtains the S-action from it along the canonical homomorphism S -> Gr(S), which
    exhibits the extension as well as asserting it. Second, the paper's Theorem F lists
    three S-systems as mutually isomorphic; the Lean statement asserts two of the three
    isomorphisms, the third following by composition.

    One point of phrasing. The paper's Theorem A says that a factor is equicontinuous; the
    Lean statement says that the target system is an equicontinuous system. These agree on
    the reading intended throughout the paper, where an equicontinuous factor of X is a
    factor whose target is an equicontinuous system.

    A definitional point, which does not change what the theorems assert but bears on how
    they are read. The regionally proximal relation is classically defined only for group
    actions. The formal definition used here is the semigroup-action definition adopted by
    Auslander and Dai and by Dai and Xiao, and it agrees with the classical relation
    whenever the acting semigroup is a group, so no generality is lost relative to the
    classical setting. It is not the only natural generalization: the backward regionally
    proximal relation RP^- follows de Vries's group-action definition instead, and for
    semigroup actions the two relations differ in general, already for S = (N,+). Theorem C
    records that they nevertheless coincide when S is commutative and the action is
    minimal.

    The Challenge file contains some proofs as well as statements: the compact Hausdorff
    structure on the quotient of a system by an ICER is established there, since it is
    needed for the statements of Theorems B, E and F to typecheck. These proofs are part of
    the audited surface. The Lean proof of the T2Space (ICERQuotient I) instance was
    written by Claude Opus 5 High from an English proof the authors supplied, as recorded
    in the automation section; the argument is the authors'. Every other proof in the
    Challenge file, and every statement in it, was written by hand.

review:
  status: "author-verified"
  reviewers:
    - "Angelina Blahodatna"
    - "Lauren Detmold"
    - "Daniel Glasscock"
    - "Anh N. Le"
  notes: >-
    The authors wrote by hand every definition and theorem statement registered in this
    submission, and audited those statements against the paper. The Lean proof of one instance in the
    Challenge file, T2Space (ICERQuotient I), was rendered by a model from an English proof
    the authors supplied, and is identified as such in the automation section. Parts of the supporting
    development were machine-written, as recorded in the automation section, and some of
    that machine-written code lies in the import closure of the registered proofs. All
    submitted code was reviewed by the authors and checked by the Lean elaborator and
    compiler. This status does not claim independent peer review, nor a complete
    line-by-line human audit of every machine-generated proof.

alignment:
  namespace: "RPIntro"
  notes: >-
    The six theorems are stated without proof, as five declarations, in
    Palomar/RP/Challenge.lean, together with the definitions, structures and instances
    needed to read the statements. The same five declarations are stated and proved under
    identical fully qualified names in NSFLEAPS/RP_main_theorems.lean, and
    Palomar/RP/Solution.lean supplies the proved forms by importing that module. Every
    declaration shared between the Challenge and the development agrees character for
    character, so the Challenge definitions and the development's copies of them are
    identical rather than merely equivalent.

    The development's copies are, in several cases, simplified forms of notions defined
    upstream in the project. Two conversion definitions, dSystemToRootdSystem and
    rootdSystemTodSystem, move between the Challenge's DynamicalSystem structure and the
    development's, and seven translation lemmas connect the simplified definitions to their
    upstream analogues: minimalIsSame, RPSameFromIntroToRoot, RPSameFromRootToIntro,
    RPMSame, EquiSystemSame, EquiStructureSame and QuotSameViaIsom. Auditing the statements
    of the main theorems requires reading only the Challenge file; the translation lemmas
    and their proofs do not need to be audited for that purpose.
  statements:
    - source: "Theorem A (Section 1.2; proof in Section 3.3)"
      lean: "RPIntro.RPTheoremA"
      module: "NSFLEAPS/RP_main_theorems.lean"
      status: "proved"
      note: >-
        For a commutative semigroup S and a minimal S-system X, a factor is equicontinuous
        if and only if RP is contained in the relation it induces.

    - source: "Theorem B (Section 1.2; proof in Section 5.3)"
      lean: "RPIntro.RPTheoremB"
      module: "NSFLEAPS/RP_main_theorems.lean"
      status: "proved"
      note: >-
        The regionally proximal relation coincides with the equicontinuous structure
        relation. The declaration also carries the paper's two stated consequences: that RP
        is realized by an ICER, that is, a closed S-invariant equivalence relation, and that
        the quotient of X by it is the largest equicontinuous factor of X.

    - source: "Theorem C (Section 1.2; proof in Section 3)"
      lean: "RPIntro.RPTheoremC"
      module: "NSFLEAPS/RP_main_theorems.lean"
      status: "proved"
      note: >-
        For a commutative semigroup acting minimally, the regionally proximal and backward
        regionally proximal relations coincide.

    - source: "Theorem D (Section 1.3; proof in Section 6.1)"
      lean: "RPIntro.RPTheoremD"
      module: "NSFLEAPS/RP_main_theorems.lean"
      status: "proved"
      note: >-
        Commuting minimal actions of two commutative semigroups on the same space induce
        the same regionally proximal relation.

    - source: "Theorems E and F (Section 1.3; proofs in Sections 6.3 and 6.4)"
      lean: "RPIntro.RPTheoremsEandF"
      module: "NSFLEAPS/RP_main_theorems.lean"
      status: "proved"
      note: >-
        The declaration asserts the existence of the natural extension and its universal
        property, then states the isomorphisms of largest equicontinuous factors described
        in Theorem F. See the fidelity section for why the two theorems are stated as one
        declaration.

