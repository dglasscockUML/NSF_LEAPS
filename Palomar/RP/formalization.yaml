# formalization.yaml v0.4
version: "v0.4"

project:
  name: "The regionally proximal relation for commutative semigroup actions"
  description: >-
    The regionally proximal relation and the equicontinuous structure relation are
    fundamental relations in topological dynamics that capture equicontinuous behaviour in
    a topological dynamical system and its factors. For minimal actions of abelian groups
    they are known to be equivalence relations and to coincide. This development formalizes
    in Lean 4 the results of the paper "The regionally proximal relation for commutative
    semigroup actions", which generalizes these facts from group actions to semigroup
    actions.

    Throughout, a system is an action of a discrete semigroup S on a compact Hausdorff
    space X by continuous maps. A factor is a continuous S-equivariant surjection. The
    system X is minimal if every orbit is dense, and equicontinuous if the family of maps
    {s : X -> X} is uniformly equicontinuous. The regionally proximal relation RP consists
    of the pairs (x,y) such that for all neighbourhoods U of x and V of y and all
    neighbourhoods a of the diagonal, there are x' in U, y' in V and s in S with (sx', sy')
    in a. The equicontinuous structure relation Seq consists of the pairs identified by
    every equicontinuous factor.

    The regionally proximal relation has classically been defined only for group actions.
    The definition used here, for actions of a general semigroup, is the one adopted by
    Auslander and Dai and by Dai and Xiao; it agrees with the classical notion when the
    acting semigroup is a group. A second, inequivalent generalization is also natural: the
    backward regionally proximal relation RP^-, obtained by following the group-action
    definition of de Vries. For semigroup actions the two differ in general, already for
    S = (N,+), which is what makes Theorem C below a statement with content.

    Theorem A states that for a commutative semigroup S and a minimal S-system X, a factor
    is equicontinuous exactly when RP is contained in the relation it induces. Theorem B
    states that RP and Seq coincide; in particular RP is a closed, S-invariant equivalence
    relation and X -> X/RP is the largest equicontinuous factor of X. Theorem B is
    apparently new even for systems generated by a single non-invertible map. Theorem C
    states that RP coincides with the backward regionally proximal relation RP^-, the
    second natural generalization of regional proximality from groups to semigroups; the
    two differ in general for semigroup actions, already for S = (N,+). Theorem D states
    that commuting minimal actions of two commutative semigroups on the same space induce
    the same regionally proximal relation.

    Theorems E and F concern natural extensions. Theorem E constructs, for any minimal
    action of a commutative semigroup, a smallest extension on which the semigroup acts by
    homeomorphisms: a minimal S-system W and a factor map W -> X through which every
    extension of X by homeomorphisms factors. The construction goes through the
    Grothendieck group Gr(S) of S and requires no cancellativity assumption. Theorem F
    identifies the largest equicontinuous factor of X with that of its natural extension
    W, both as an S-system and as a Gr(S)-system.

    The proof of Theorem B follows the cube-space methods of Glasner, Gutman and Ye,
    generalized in places and specialized in others, using ultrafilters in place of
    enveloping semigroups and nets to simplify formalization. The development runs to
    roughly 20,000 lines of Lean across 17 files and formalizes every lemma, proposition,
    corollary and theorem of the paper; the registered statements are Theorems A through F.
    The same repository also formalizes a companion paper on the local structure of Delta*
    sets, registered separately as Palomar entry PALOMAR-2026-10-18-000015.
