status:
  scope: >-
    Every result in the source paper labelled lemma, proposition, corollary or theorem is
    fully formalized in the development, including the two substantial supporting
    components the main argument rests on: that the regionally proximal relation is an
    equivalence relation for minimal actions of commutative semigroups, and the Furstenberg
    family algebra. The development additionally proves a classical fact absent from
    Mathlib, that characters separate points in a compact abelian group, which does not
    itself appear as a stated theorem in the paper.

    The Challenge file contains only Theorems A, B, C and D as stated in the paper's
    introduction; the remaining formalized results are present in the development but are
    not part of the registered statement set.

    Semigroups are assumed nonempty throughout, in the paper and in the formalization
    alike. Theorem C assumes the semigroup is countable; this hypothesis is present in the
    paper's statement of Theorem C and the formal statement matches it. Theorems A, B and D
    carry no countability hypothesis. Both degenerate Furstenberg families, the empty
    family and the full power set, are admitted as Furstenberg families and are handled
    explicitly in the development rather than excluded by hypothesis.

    No result is assumed from the literature rather than derived. Every result the proofs
    depend on is either proved within the development or available in the pinned Mathlib;
    in particular the Pontryagin separation fact named above is proved in full in
    FF_Pontryagin.lean rather than assumed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Hand-coding of a substantial portion of the definitions, theorem statements and
        theorem proofs, and hand-scaffolding of helper theorem statements and proof steps.
      cost:
        wall_time: "approximately 6 months of effort"
        spend_usd: "n/a"
        hardware: "n/a"
      prompting_notes: "n/a"

    - method: "agent"
      models: ["Claude Opus 5 High"]
      framework: "Claude Code"
      tool_setup: >-
        Autonomous coding of the file FF_Pontryagin.lean, completed in a single pass with a
        sorry-free build. The target theorem, PontryaginDual.exists_apply_ne_one, that
        characters separate points in a compact abelian group, is classical but not
        available in Mathlib.
      cost:
        wall_time: "approximately 1 hour"
        spend_usd: "subscription-based"
        hardware: "local machine and API"
      prompting_notes: >-
        Instructions were to match the hand-stated target theorem
        PontryaginDual.exists_apply_ne_one; to make edits only to the file
        FF_Pontryagin.lean; and to find and use whichever proof of the target theorem is
        best suited to formalization in Lean 4.

    - method: "copilot"
      models: ["Claude Opus 5 High"]
      framework: "Claude Code"
      tool_setup: >-
        The authors hand-scaffolded the main theorems in RP_Nat_ext.lean, and the model
        supplied proofs of those theorems, introducing definitions and helper lemmas as
        necessary.
      cost:
        wall_time: "approximately 1 hour over a single run"
        spend_usd: "subscription-based"
        hardware: "local machine and API"
      prompting_notes: >-
        Instructions were to edit the RP_Nat_ext.lean file only; to provide proofs for the
        already-scaffolded main theorems following proofs supplied by the authors in a
        write-up; and not to edit the main theorem statements in any way.

    - method: "copilot"
      models: ["Claude Opus 5 High"]
      framework: "Claude Code"
      tool_setup: >-
        The model supplied proofs of approximately two dozen theorems across the project,
        following proofs the authors wrote in English in LaTeX and provided to it. Work
        proceeded on a theorem-by-theorem basis, with output reviewed and managed after
        each call. Helper lemmas introduced by the model were organized by hand into the
        project structure; several were placed in TP_Defs.lean.
      cost:
        wall_time: "approximately 2 hours, broken into runs of roughly 10 minutes"
        spend_usd: "subscription-based"
        hardware: "local machine and API"
      prompting_notes: >-
        Instructions were given on a line-by-line basis. A representative prompt: "Write a
        proof of preStrongIPIffStrongCentralInCountCommSemi in the FF_Defs.lean file. Add
        lines only; do not modify or delete any lines. Follow the proof in the attached pdf
        file. Do not change any other part of the FF_Defs.lean file. If you need a helper
        lemma, you can write it just above preStrongIPIffStrongCentralInCountCommSemi.
        Before writing a helper lemma, search for what you need in the files upstream in
        the project."
  spend_usd: "subscription-based"
  notes: >-
    All mathematical content in this project is the work of the authors. Every definition,
    every main theorem statement, and every proof appearing in the source paper was
    developed and written by hand, as mathematical prose, before formalization was
    attempted. Automation was applied only to the task of rendering that mathematics in
    Lean: agents were given human-written proofs and asked to encode them, not to find
    them, with the noted exception of the results in FF_Pontryagin.lean.

    Coding agents were used in three roles: to supply Lean proofs of individual theorems,
    one at a time, from English proofs the authors wrote and provided; to produce the
    FF_Pontryagin.lean file; and to supply proofs for theorem statements the authors had
    already scaffolded by hand in RP_Nat_ext.lean. Main theorem statements and definitions
    were hand-written throughout, and agents were instructed not to modify them.

    FF_Pontryagin.lean is the one exception to the description above. Its target statement
    was fixed by hand, but the agent was asked to locate and formalize whichever proof of
    that statement was best suited to Lean, so the choice of argument there was the agent's
    rather than the authors'. The result concerned, that the characters of a compact
    abelian group separate its points, is classical, is not original to this paper, and is
    referenced in the paper only as a tool, without proof.

    Agent output was reviewed and organized by the authors as it was produced, with helper
    lemmas placed by hand into the project structure. We do not claim independent peer
    review or a complete line-by-line human audit of every machine-generated proof.

fidelity:
  divergences: >-
    There are no known divergences between the formally verified statements in Lean and the
    statements of the main theorems in the introduction of the source paper.

    One representational choice is worth recording, although it does not change what is
    asserted. Bohr_0 sets are formalized through semigroup homomorphisms into Fin d →
    Circle, the d-dimensional torus presented as a power of the unit circle in ℂ, rather
    than as ℝ^d/ℤ^d as written in the paper. As in the paper, no continuity is required of
    these homomorphisms.

