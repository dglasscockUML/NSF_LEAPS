alignment:
  namespace: "DeltaIntro"
  notes: >-
    Each of the four theorems is stated without proof in Palomar/Delta/Challenge.lean,
    together with the sixteen definitions needed to read the statements, and is stated and
    proved under the same fully qualified name in NSFLEAPS/Delta_main_theorems.lean.
    Palomar/Delta/Solution.lean supplies the proved forms by importing that module. Three
    translation lemmas in Delta_main_theorems.lean, namely thickIsSame, IPIsSame and
    centralIsSame, connect the definitions as stated for the reader to the equivalent
    notions the development works with internally; the remaining definitions agree with the
    development's own by definitional equality.
  statements:
    - source: "Theorem A (Section 1.2; proof in Section 5.3)"
      lean: "DeltaIntro.DeltaTheoremA"
      module: "NSFLEAPS/Delta_main_theorems.lean"
      status: "proved"
      note: >-
        The main result: in a commutative semigroup, a Δ* set agrees with a Bohr_0 set on a
        thick subset of any prescribed thick set. The formal statement carries the
        containment H′ ⊆ H explicitly, as the paper's does. Bohr_0 sets are formalized
        through semigroup homomorphisms into Fin d → Circle rather than into ℝ^d/ℤ^d; no
        continuity is required of these homomorphisms, matching the paper.

    - source: "Theorem B (Section 1.2; proof in Section 5.3)"
      lean: "DeltaIntro.DeltaTheoremB"
      module: "NSFLEAPS/Delta_main_theorems.lean"
      status: "proved"
      note: >-
        The dual formulation, in terms of Δ sets and sets of Bohr recurrence, that the proof
        establishes directly. The paper derives A and B from one another using the family
        algebra of Section 1.4; the formalization proves B first and obtains A from it, so
        both are proved rather than one being derived informally from the other.

    - source: "Theorem C (Section 1.2; proof in Section 5.4)"
      lean: "DeltaIntro.DeltaTheoremC"
      module: "NSFLEAPS/Delta_main_theorems.lean"
      status: "proved"
      note: >-
        In a countable commutative semigroup, a central* set agrees with an IP* set on a
        thick subset of any prescribed thick set. The countability hypothesis appears in
        the paper's statement and in the formal statement alike. IP and central sets are
        formalized as membership in an idempotent, respectively minimal idempotent,
        ultrafilter, with multiplication given by Ultrafilter.mul from
        Mathlib.Combinatorics.Hindman; IPIsSame and centralIsSame link these to the
        development's closely-related formulations.

    - source: "Theorem D (Section 1.4; proof in Section 3)"
      lean: "DeltaIntro.DeltaTheoremD"
      module: "NSFLEAPS/Delta_main_theorems.lean"
      status: "proved"
      note: >-
        The algebraic properties of family meet, family join and the family dual, stated
        for an arbitrary non-empty set with no semigroup structure, as in Section 1.4. The
        single declaration bundles ten conclusions: closure of meet and join on families,
        associativity and commutativity of each, monotonicity of each in both arguments,
        and the two De Morgan-type laws of equation (1.2).

