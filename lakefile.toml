name = "NSF_LEAPS"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["NSFLEAPS", "Palomar"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "NSFLEAPS"
globs = ["NSFLEAPS.+"]

[[lean_lib]]
name = "Palomar"
roots = ["Palomar.Delta.Challenge", "Palomar.Delta.Solution",
         "Palomar.RP.Challenge", "Palomar.RP.Solution"]
